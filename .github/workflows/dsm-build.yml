name: DSM Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download DSM source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download DSM \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "DSM-v0.2.1.zip" \
            --dir input
          echo "Downloaded:"
          ls -lh input/

      - name: Extract DSM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q input/DSM-v0.2.1.zip -d source
          echo "Project:"
          ls -la source/DSM

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install dependencies
        shell: bash
        working-directory: source/DSM
        run: |
          set -euo pipefail
          pnpm install

      - name: Build Windows
        shell: bash
        working-directory: source/DSM
        run: |
          set -euo pipefail
          pnpm build-win

      - name: Analyze packaged application
        shell: bash
        working-directory: source/DSM
        run: |
          set -euo pipefail

          PACKAGED="dist/electron/Packaged"
          UNPACKED="${PACKAGED}/win-unpacked"
          ASAR="${UNPACKED}/resources/app.asar"

          echo "========== PACKAGE SIZES =========="
          du -sh "${UNPACKED}" "${ASAR}" "${PACKAGED}/DSM 0.2.1.exe" "${PACKAGED}/DSM Setup 0.2.1.exe" 2>/dev/null || true
          echo "==================================="

          echo
          echo "========== TOP FILES IN APP =========="
          find "${UNPACKED}" -type f -printf '%s %p\n' 2>/dev/null \
            | sort -nr \
            | head -50 \
            | awk '{printf "%.1f MB  ", $1/1024/1024; $1=""; sub(/^ /,""); print}'
          echo "======================================="

          if command -v npx >/dev/null 2>&1 && [ -f "${ASAR}" ]; then
            echo
            echo "========== APP.ASAR CONTENT =========="
            npx --yes @electron/asar@4.0.1 list "${ASAR}" > asar-list.txt
            echo "ASAR entries: $(wc -l < asar-list.txt)"
            echo
            echo "Largest files inside app.asar:"
            while IFS= read -r p; do
              if [ -f "${UNPACKED}/resources/app.asar" ]; then
                :
              fi
            done < asar-list.txt
            echo "Use ASAR archive metadata for detailed inspection."
            echo "======================================"
          fi

          echo
          echo "========== TOP DIRECTORIES =========="
          du -ah "${UNPACKED}" 2>/dev/null \
            | sort -hr \
            | head -40
          echo "====================================="
      - name: Find build output
        shell: bash
        working-directory: source/DSM
        run: |
          set -euo pipefail
          echo "========== BUILD OUTPUT =========="
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) -print
          echo "=================================="

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DSM-Windows
          path: |
            source/DSM/dist/**
            source/DSM/release/**
          if-no-files-found: error
