name: DSM Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download DSM source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download DSM \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "DSM-v0.2.1.zip" \
            --dir input
          echo "Downloaded:"
          ls -lh input/

      - name: Extract DSM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q input/DSM-v0.2.1.zip -d source
          echo "Project:"
          ls -la source/DSM

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install dependencies
        shell: bash
        working-directory: source/DSM
        run: |
          set -euo pipefail
          pnpm install

      - name: Build Windows
        shell: bash
        working-directory: source/DSM
        run: |
          set -euo pipefail
          pnpm build-win

      - name: Find build output
        shell: bash
        working-directory: source/DSM
        run: |
          set -euo pipefail
          echo "========== BUILD OUTPUT =========="
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.zip" \) -print
          echo "=================================="

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DSM-Windows
          path: |
            source/DSM/dist/**
            source/DSM/release/**
          if-no-files-found: error
